name: 🚀 Deploy Template
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} 
    steps:
      - name: Deploying to ${{ inputs.environment }}
        run: |
          echo "Deploying artifact: ${{ github.sha }}"
          echo "bash deploy.sh ${{ vars.env }}"
